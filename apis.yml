aid: niron-magnetics
name: Niron Magnetics
description: 'Niron Magnetics is a U.S. advanced-manufacturing company commercializing
  high-performance permanent magnets made from Iron Nitride rather than rare-earth
  elements. Spun out of University of Minnesota and U.S. Department of Energy ARPA-E
  research and founded in 2013, the company holds 150+ patents around its Clean Earth
  Magnet technology and is building the first full-scale Iron Nitride magnet plant
  in Sartell, Minnesota, alongside its Minneapolis headquarters and a Washington,
  D.C. policy office. Its magnets target electric-motor, automotive, consumer-audio,
  industrial and defense applications, with announced collaborations including Stellantis,
  Moog, Aspina, FaitalPRO, MATTER and Bimotal. Niron Magnetics is a materials and
  hardware manufacturer: it publishes no developer program, no public API, and no
  machine-readable API contract.'
